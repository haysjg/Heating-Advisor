<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe – Conseiller Chauffage</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      color: var(--text);
    }
    .login-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin: 0 0 2rem;
    }
    .login-label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-bottom: 0.35rem;
    }
    .login-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.85rem;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .login-input:focus { outline: none; border-color: var(--blue); }
    .login-btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.25rem;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.875rem;
      padding: 0.6rem 0.85rem;
      margin-bottom: 1.25rem;
    }
      .login-hint { font-size: 0.78rem; color: var(--text-sub); margin: 0.35rem 0 0.9rem; }
    .login-field + .login-field { margin-top: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <p class="login-title">🔥 Heating Advisor</p>
    {% if forced %}
    <p class="login-sub">Le mot de passe par défaut est encore actif. Choisissez votre propre mot de passe pour continuer.</p>
    {% else %}
    <p class="login-sub">Changer le mot de passe de connexion</p>
    {% endif %}

    <div class="login-error" id="pwd-error" hidden></div>

    <form id="pwd-form">
      <div class="login-field">
        <label class="login-label" for="current_password">Mot de passe actuel</label>
        <input class="login-input" type="password" id="current_password"
               autocomplete="current-password" required {% if forced %}autofocus{% endif %}>
      </div>
      <div class="login-field">
        <label class="login-label" for="new_password">Nouveau mot de passe</label>
        <input class="login-input" type="password" id="new_password"
               autocomplete="new-password" minlength="8" required>
        <p class="login-hint">8 caractères minimum.</p>
      </div>
      <div class="login-field">
        <label class="login-label" for="confirm_password">Confirmer le nouveau mot de passe</label>
        <input class="login-input" type="password" id="confirm_password"
               autocomplete="new-password" minlength="8" required>
      </div>
      <button class="login-btn" type="submit" id="pwd-submit">Enregistrer et continuer</button>
    </form>
  </div>

  <script>
    document.getElementById('pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('pwd-error');
      const btn = document.getElementById('pwd-submit');
      const newPwd = document.getElementById('new_password').value;
      err.hidden = true;
      if (newPwd !== document.getElementById('confirm_password').value) {
        err.textContent = 'Les deux nouveaux mots de passe ne correspondent pas.';
        err.hidden = false;
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
          body: JSON.stringify({
            current_password: document.getElementById('current_password').value,
            new_password: newPwd,
          }),
        });
        const data = await res.json();
        if (res.ok) { window.location.href = '/'; return; }
        err.textContent = data.error || 'Changement impossible.';
      } catch (ex) {
        err.textContent = 'Serveur injoignable, réessayez.';
      }
      err.hidden = false;
      btn.disabled = false;
    });
  </script>
</body>
</html>
